<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Data Penduduk</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet"
    href="{{ url_for('static', filename='static_admin/css/edit_data.css') }}">
</head>

<body>

<!-- ===== TOP NAVBAR ===== -->
        <header class="admin-navbar">
            <div class="container">
                <div class="navbar-left">
                    <div class="logo">
                        <img src="{{ url_for('static', filename='image/logo.png') }}" alt="Logo Desa" />
                        <span>Desa Katemas</span>
                    </div>
                </div>
                <div class="navbar-right">
                    <div class="admin-profile" id="adminProfile">
                        <div class="profile-info">
                            <span class="name">Admin Desa</span>
                            <span class="role">Administrator</span>
                        </div>
                        <div class="avatar">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <i class="fa-solid fa-chevron-down" id="profileToggle"></i>
                        <div class="dropdown-menu" id="dropdownMenu">
                            <a href="{{ url_for('admin_bp.logout') }}" class="dropdown-item logout">
                                <i class="fa-solid fa-right-from-bracket"></i> Keluar / Logout
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </header>
<div class="container">

    <div class="title">
        <h1>Kelola Data Penduduk</h1>
        <p>Perbarui data kependudukan, pendidikan, dan pekerjaan secara real-time untuk transparansi publik.</p>
    </div>

<form>

<!-- ================= DATA UMUM ================= -->

<div class="card">

    <div class="card-header">

        <h3>Data Umum Kependudukan</h3>

    </div>

    <div class="grid-4">

        <div class="form-group">
            <label>Jumlah Penduduk</label>
            <input type="number">
        </div>

        <div class="form-group">
            <label>Jumlah KK</label>
            <input type="number">
        </div>

        <div class="form-group">
            <label>Laki-Laki</label>
            <input type="number">
        </div>

        <div class="form-group">
            <label>Perempuan</label>
            <input type="number">
        </div>

    </div>
<div class="button-group">
            <button type="reset" class="btn-cancel">
                Batal
            </button>

            <button type="submit" class="btn-save">
                Simpan
            </button>
        </div>
</div>

<!-- ================= PENDIDIKAN ================= -->

<div class="card">

    <div class="card-header">

        <h3>
            <i class="fa-solid fa-graduation-cap"></i>
            Data Pendidikan
        </h3>

    </div>

<div class="grid-2">

<div class="form-group">
<label>Belum Sekolah</label>
<input type="number">
</div>

<div class="form-group">
<label>Belum Tamat SD</label>
<input type="number">
</div>

<div class="form-group">
<label>Tamat SD</label>
<input type="number">
</div>

<div class="form-group">
<label>Tamat SMP</label>
<input type="number">
</div>

<div class="form-group">
<label>Tamat SLTA</label>
<input type="number">
</div>

<div class="form-group">
<label>Diploma I/II/III</label>
<input type="number">
</div>

<div class="form-group">
<label>Sarjana S1</label>
<input type="number">
</div>

<div class="form-group">
<label>Diploma IV / Strata I</label>
<input type="number">
</div>

<div class="form-group">
<label>Strata II</label>
<input type="number">
</div>

<div class="form-group">
<label>Strata III</label>
<input type="number">
</div>

</div>
<div class="button-group">

            <button type="reset" class="btn-cancel">
                Batal
            </button>

            <button type="submit" class="btn-save">
                Simpan
            </button>

        </div>
</div>

<!-- ================= PEKERJAAN ================= -->

<div class="card">

<div class="card-header">

<h3>
<i class="fa-solid fa-briefcase"></i>
Data Pekerjaan
</h3>
</div>

<div class="grid-2">

<div class="form-group">
<label>Belum/Tidak Bekerja</label>
<input type="number">
</div>

<div class="form-group">
<label>Mengurus Rumah Tangga</label>
<input type="number">
</div>

<div class="form-group">
<label>Pelajar/Mahasiswa</label>
<input type="number">
</div>

<div class="form-group">
<label>Pensiunan</label>
<input type="number">
</div>

<div class="form-group">
<label>PNS</label>
<input type="number">
</div>

<div class="form-group">
<label>Wiraswasta</label>
<input type="number">
</div>

<div class="form-group">
<label>Petani</label>
<input type="number">
</div>

<div class="form-group">
<label>Peternak</label>
<input type="number">
</div>

<div class="form-group">
<label>Karyawan</label>
<input type="number">
</div>

<div class="form-group">
<label>Buruh Pabrik</label>
<input type="number">
</div>

<div class="form-group">
<label>Guru</label>
<input type="number">
</div>

<div class="form-group">
<label>Bidan</label>
<input type="number">
</div>

<div class="form-group">
<label>Perawat</label>
<input type="number">
</div>

<div class="form-group">
<label>Pedagang</label>
<input type="number">
</div>
</div>
<div class="button-group">

    <button type="reset" class="btn-cancel">
        Batal
    </button>

    <button type="submit" class="btn-save">
        Simpan
    </button>

</div>
</div>

</div>
</div>

</form>

</div>
</body>
        <!-- ===== COPYRIGHT ===== -->
        <div class="copyright">
            © 2026 KKN Kelompok 16 UPN Veteran Jawa Timur
        </div>
</html>
