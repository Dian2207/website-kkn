<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Tambah Berita</title>

<link rel="stylesheet"
href="{{ url_for('admin_bp.static',
filename='css/tambah_berita.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

</head>

<body>
<div class="admin-wrapper">

    <!-- ===== TOP NAVBAR ===== -->
    <header class="admin-navbar">
        <div class="container">
            <div class="navbar-left">
                <div class="logo">
                    <img src="{{ url_for('static', filename='image/logo.png') }}" alt="Logo Desa" />
                    <span>Desa Katemas</span>
                </div>
            </div>
            <div class="navbar-right">
                <div class="admin-profile" id="adminProfile">
                    <div class="profile-info">
                        <span class="name">Admin Desa</span>
                        <span class="role">Administrator</span>
                    </div>
                    <div class="avatar">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <i class="fa-solid fa-chevron-down" id="profileToggle"></i>
                    <div class="dropdown-menu" id="dropdownMenu">
                        <a href="{{ url_for('admin_bp.logout') }}" class="dropdown-item logout">
                            <i class="fa-solid fa-right-from-bracket"></i> Keluar / Logout
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="admin-content">
        <div class="container">

            <!-- Tombol Kembali -->
            <div class="page-header">
                <a href="{{ url_for('admin_bp.indexAdmin') }}" class="btn-back">
                    <i class="fa-solid fa-arrow-left"></i> Kembali ke Dashboard
                </a>
            </div>

            <!-- Form -->
            <form class="news-form" method="POST" action="{{ url_for('admin_bp.simpan_berita') }}" enctype="multipart/form-data">

                <div class="content">

                    <div class="left">

                        <div class="card">

                            <label>Judul Berita</label>
                            <input
type="text"
name="title"
placeholder="Masukkan judul berita..."
value="{{ berita.title if berita else '' }}">

                            <label>Slug</label>
                            <input
type="text"
name="slug"
value="{{ berita.slug if berita else '' }}">
                            <label>Tanggal Publikasi</label>
<input
type="date"
name="published_at"
value="{% if berita and berita.published_at %}{{ berita.published_at.strftime('%Y-%m-%d') }}{% endif %}">
                        </div>

                        <div class="card">

                            <label>Isi Berita</label>
                            <textarea
name="content">{{ berita.content if berita else '' }}</textarea>

                        </div>

                    </div>
<div class="right">

    <!-- Gambar -->
    <div class="card">
        <h4>Gambar Utama</h4>

        <input
            type="file"
            name="thumbnail"
            accept="image/*">

        {% if edit and berita.thumbnail %}
        <div class="preview-image">
            <img
                src="{{ url_for('static', filename='uploads/' + berita.thumbnail) }}"
                alt="Thumbnail Berita">
        </div>
        {% endif %}
    </div>

    <!-- Status -->
    <div class="card">
        <h4>Status</h4>

        <label class="radio-item">
            <input
                type="radio"
                name="status"
                value="draft"
                {% if not berita or not berita.published_at %}checked{% endif %}>
            Draft
        </label>

        <label class="radio-item">
            <input
                type="radio"
                name="status"
                value="published"
                {% if berita and berita.published_at %}checked{% endif %}>
            Publikasikan
        </label>
    </div>

    <!-- Tombol -->
    <div class="form-actions">
        <button class="btn-save" type="submit">
            {% if edit %}
                Perbarui Berita
            {% else %}
                Simpan
            {% endif %}
        </button>
    </div>

</div>

            </form>

        </div>
    </main>

</div>

<script>
    // Dropdown toggle
    document.addEventListener('DOMContentLoaded', function() {
        const profileToggle = document.getElementById('profileToggle');
        const dropdownMenu = document.getElementById('dropdownMenu');

        if (profileToggle && dropdownMenu) {
            profileToggle.addEventListener('click', function(e) {
                e.stopPropagation();
                dropdownMenu.classList.toggle('show');
                this.classList.toggle('active');
            });

            document.addEventListener('click', function(e) {
                const profile = document.getElementById('adminProfile');
                if (!profile.contains(e.target)) {
                    dropdownMenu.classList.remove('show');
                    profileToggle.classList.remove('active');
                }
            });
        }
    });
</script>
<!-- ===== COPYRIGHT ===== -->
    <div class="copyright">
        © 2026 KKN Kelompok 16 UPN Veteran Jawa Timur
    </div>
</body>

</html>
